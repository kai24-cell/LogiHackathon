# No credentials. Pass the connection token through the launcher environment.
server.address=127.0.0.1
server.port=8765
cheapreview.scan.max-file-bytes=1048576
cheapreview.scan.max-visited-entries=100000
cheapreview.scan.max-source-files=10000
cheapreview.scan.max-total-bytes=104857600
cheapreview.scan.timeout-seconds=60
cheapreview.bridge.heartbeat-timeout=30s
cheapreview.bridge.request-timeout=120s
cheapreview.bridge.max-requests=100
cheapreview.workspace.max-workspaces=20
cheapreview.workspace.max-jobs=100
cheapreview.workspace.worker-threads=2
### Search: provisional weights must be non-negative and sum to 1.
cheapreview.search.cosine-weight=0.50
cheapreview.search.dependency-weight=0.30
cheapreview.search.role-weight=0.20
cheapreview.search.max-indexes=1
### Budget: provisional coefficients, not provider measurements.
cheapreview.budget.ascii-weight=0.35
cheapreview.budget.japanese-weight=1.50
cheapreview.budget.other-weight=1.00
cheapreview.budget.margin-rate=0.20
cheapreview.budget.min-margin=512
cheapreview.budget.max-output-tokens=2048
cheapreview.budget.max-methods-per-file=3
cheapreview.budget.max-previews=100
### No API key in configuration: configure it through the Web for this session.
cheapreview.generation.timeout-seconds=120
